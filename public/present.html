<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示画面 - 数学ボード</title>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2463eb">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="数学ボード">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="present" id="view"></main>
  <div class="ptimer hidden" id="ptimer" title="押すと一時停止・再開"></div>
  <div class="controls">
    <button class="small" id="smaller" title="文字を小さく">A−</button>
    <button class="small" id="bigger" title="文字を大きく">A＋</button>
    <button class="small" id="cards" title="カードの大きさ">カード：中</button>
    <button class="small" id="qr" title="参加QRコード">QR</button>
    <button class="small" id="full" title="全画面">⛶</button>
  </div>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="/vendor/firebase.js"></script>
  <script src="/firebase-config.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const { h, fill, $, rich, img, toast } = MB;
    const view = $('#view');
    const CARD_SIZES = [['小', 200], ['中', 270], ['大', 380]];
    const prefs = { size: 22, card: 1 };
    try { Object.assign(prefs, JSON.parse(localStorage.getItem('mb-present') || '{}')); } catch { /* 無視 */ }
    if (!(prefs.card >= 0 && prefs.card < CARD_SIZES.length)) prefs.card = 1;
    let showQr = false;
    let store = null;
    let answers = []; // いま並んでいる回答
    let zoomPath = null; // 大きく見ている回答

    function applyPrefs() {
      document.documentElement.style.setProperty('--present-size', `${prefs.size}px`);
      view.style.setProperty('--card', `${CARD_SIZES[prefs.card][1]}px`);
      $('#cards').textContent = `カード：${CARD_SIZES[prefs.card][0]}`;
      try { localStorage.setItem('mb-present', JSON.stringify(prefs)); } catch { /* 無視 */ }
    }

    function answerBody(s, large) {
      const imgStyle = large ? {} : { maxHeight: '150px', objectFit: 'contain', width: '100%' };
      return [
        s.shortAnswer ? h('div', { style: { fontSize: large ? '1.6em' : '1.2em', fontWeight: 800 } }, s.shortAnswer) : null,
        s.text ? h('div', { class: large ? '' : 'pclip' }, rich(s.text)) : null,
        s.drawing ? img(s.drawing, { class: 'answer-image', alt: '手書き', style: imgStyle }) : null,
        s.photo ? img(s.photo, { class: 'answer-image', alt: '写真', style: imgStyle }) : null,
      ];
    }

    // 1つを大きく見る。← → で前後に移る
    function renderZoom() {
      const old = $('.zoom');
      if (old) old.remove();
      const i = answers.findIndex((a) => a.path === zoomPath);
      if (i < 0) { zoomPath = null; return; }
      const a = answers[i];
      const go = (d) => (e) => {
        e.stopPropagation();
        zoomPath = answers[(i + d + answers.length) % answers.length].path;
        renderZoom();
      };
      const el = h('div', { class: 'zoom', onclick: () => { zoomPath = null; renderZoom(); } },
        h('div', { class: 'row', style: { marginBottom: '12px' }, onclick: (e) => e.stopPropagation() },
          h('strong', { style: { color: 'var(--accent)', fontSize: '1.1em' } }, a.label),
          h('span', { class: 'muted' }, `${i + 1} / ${answers.length}`),
          h('span', { class: 'grow' }),
          answers.length > 1 ? h('button', { onclick: go(-1) }, '← 前') : null,
          answers.length > 1 ? h('button', { onclick: go(1) }, '次 →') : null,
          h('button', { onclick: () => { zoomPath = null; renderZoom(); } }, '× 閉じる')),
        h('div', { class: 'stack', onclick: (e) => e.stopPropagation() }, ...answerBody(a, true)));
      document.body.append(el);
    }

    document.addEventListener('keydown', (e) => {
      if (!zoomPath) return;
      const i = answers.findIndex((a) => a.path === zoomPath);
      if (e.key === 'Escape') zoomPath = null;
      else if (e.key === 'ArrowRight' || e.key === ' ') zoomPath = answers[(i + 1) % answers.length].path;
      else if (e.key === 'ArrowLeft') zoomPath = answers[(i - 1 + answers.length) % answers.length].path;
      else return;
      e.preventDefault();
      renderZoom();
    });

    function joinBox() {
      const code = store.state.settings.joinCode;
      const url = `${location.origin}/?join=${encodeURIComponent(code)}`;
      const qr = window.qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      const box = h('div', { class: 'qr', style: { width: '220px', height: '220px' } });
      box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      return h('div', { class: 'card join' }, box,
        h('div', {}, h('div', { class: 'muted' }, '参加コード'), h('div', { class: 'code-big', style: { fontSize: '3em' } }, code),
          h('div', { class: 'muted' }, location.origin)));
    }

    function render() {
      const p = store.state.present;
      const task = p.taskId ? store.state.tasks.get(p.taskId) : null;
      const subs = task ? store.submissionsOf(task.id).filter((s) => s.shortAnswer || s.text || s.drawing || s.photo) : [];
      const all = p.mode === 'all';
      const chosen = !task ? [] : all ? subs : (p.submissionKeys || []).map((k) => subs.find((s) => s.path === k)).filter(Boolean);
      const letters = !all && chosen.length <= 26;
      answers = chosen.map((s, i) => ({
        ...s,
        label: p.showNames ? s.ownerName : `回答 ${letters ? String.fromCharCode(65 + i) : i + 1}`,
      }));
      const join = showQr || p.showQr ? joinBox() : null;
      fill(view,
        join,
        task
          ? h('div', { class: 'card ptask' }, h('h1', {}, task.title), rich(task.body),
            task.imageV ? img(store.taskImage(task), { class: 'task-image', style: { maxHeight: '30vh' } }) : null,
            task.hint ? h('div', { class: 'hint' }, h('strong', {}, 'ヒント'), rich(task.hint)) : null)
          : (join ? null : h('div', { class: 'card muted' }, '先生の画面の「回答」タブで、提示する回答を選ぶか「全員の回答」を押すと、ここに表示されます。')),
        task ? h('div', { class: 'muted', style: { fontSize: '.8em' } },
          all ? `全員の回答（${answers.length}件）` : `選んだ回答（${answers.length}件）`, answers.length ? '　押すと大きく表示します' : '') : null,
        answers.length ? h('div', { class: 'pgrid' }, answers.map((a) => h('div', {
          class: 'panswer',
          tabindex: 0,
          onclick: () => { zoomPath = a.path; renderZoom(); },
          onkeydown: (e) => { if (e.key === 'Enter') { zoomPath = a.path; renderZoom(); } },
        }, h('div', { class: 'label' }, a.label), ...answerBody(a, false)))) : null);
      if (zoomPath) renderZoom();
    }

    function startTimer() {
      const el = $('#ptimer');
      el.addEventListener('click', () => {
        const t = store.state.timer;
        if (t.state === 'running') store.setTimer('pause').catch((e) => toast(e.message));
        else if (t.state === 'paused') store.setTimer('resume').catch((e) => toast(e.message));
      });
      MB.onTick(() => {
        const info = MB.timerInfo(store.state.timer);
        el.classList.toggle('hidden', !info);
        if (!info) return;
        fill(el, info.done ? '時間です' : info.text,
          h('small', {}, info.paused ? '一時停止中' : info.label || (info.kind === 'timer' ? '残り時間' : '経過時間')));
        el.classList.toggle('paused', info.paused);
        el.classList.toggle('done', info.done);
      });
    }

    $('#smaller').onclick = () => { prefs.size = Math.max(14, prefs.size - 2); applyPrefs(); };
    $('#bigger').onclick = () => { prefs.size = Math.min(48, prefs.size + 2); applyPrefs(); };
    $('#cards').onclick = () => { prefs.card = (prefs.card + 1) % CARD_SIZES.length; applyPrefs(); };
    $('#qr').onclick = () => { showQr = !showQr; render(); };
    $('#full').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());

    applyPrefs();
    (async () => {
      const who = await window.Store.whoami();
      if (who.role !== 'teacher') {
        location.href = '/';
        return;
      }
      // どのクラスの提示画面か（先生の画面のリンクに付いている）
      let classId = new URLSearchParams(location.search).get('class')
        || (() => { try { return localStorage.getItem(`mb-class:${who.uid}`); } catch { return null; } })();
      if (!classId) {
        // 担当のクラスが1つだけなら、それを出す
        const classes = await window.Store.teacherClasses(who.uid).catch(() => []);
        if (classes.length === 1) classId = classes[0].id;
      }
      if (!classId) {
        fill(view, h('div', { class: 'card muted' }, '先生の画面の「提示画面を開く」から開いてください。'));
        return;
      }
      store = window.Store.teacherStore(who, classId);
      startTimer();
      store.on((types) => {
        if (!store.state.ready) return;
        // タイマーの数字は startTimer が進めるので、回答の並びは描き直さない
        if (types.size === 1 && types.has('timer')) return;
        render();
      });
    })();
  </script>
</body>
</html>
