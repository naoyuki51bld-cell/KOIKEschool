<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示画面 - 数学ボード</title>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="present" id="view"></main>
  <div class="controls">
    <button class="small" id="smaller" title="文字を小さく">A−</button>
    <button class="small" id="bigger" title="文字を大きく">A＋</button>
    <button class="small" id="cols" title="列の数">列</button>
    <button class="small" id="qr" title="参加QRコード">QR</button>
    <button class="small" id="full" title="全画面">⛶</button>
  </div>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const { api, h, $, rich, fileUrl, listen, debounce } = MB;
    const view = $('#view');
    const prefs = { size: 22, cols: 0 };
    try { Object.assign(prefs, JSON.parse(localStorage.getItem('mb-present') || '{}')); } catch { /* 無視 */ }
    let showQr = false;
    let data = null;
    let qrSvg = '';

    function applyPrefs() {
      document.documentElement.style.setProperty('--present-size', `${prefs.size}px`);
      try { localStorage.setItem('mb-present', JSON.stringify(prefs)); } catch { /* 無視 */ }
    }

    function answerBody(s) {
      return [
        s.shortAnswer ? h('div', { style: { fontSize: '1.4em', fontWeight: 800 } }, s.shortAnswer) : null,
        s.text ? rich(s.text) : null,
        s.drawing ? h('img', { class: 'answer-image', src: fileUrl(s.drawing), alt: '手書き' }) : null,
        s.photo ? h('img', { class: 'answer-image', src: fileUrl(s.photo), alt: '写真' }) : null,
      ];
    }

    function zoom(s) {
      const el = h('div', { class: 'zoom', onclick: () => el.remove() },
        h('div', { style: { fontWeight: 800, color: 'var(--accent)', marginBottom: '12px' } }, s.label), ...answerBody(s));
      document.body.append(el);
    }

    function render() {
      if (!data) return;
      const subs = data.submissions;
      const cols = prefs.cols || (subs.length <= 1 ? 1 : subs.length <= 4 ? 2 : subs.length <= 6 ? 3 : 4);
      view.style.setProperty('--cols', cols);
      const join = (showQr || data.showQr)
        ? h('div', { class: 'card join' },
          h('div', { class: 'qr', style: { width: '220px', height: '220px' } }),
          h('div', {}, h('div', { class: 'muted' }, '参加コード'), h('div', { class: 'code-big', style: { fontSize: '3em' } }, data.joinCode),
            h('div', { class: 'muted' }, location.origin)))
        : null;
      if (join) join.querySelector('.qr').innerHTML = qrSvg;
      MB.fill(view, 
        join,
        data.task
          ? h('div', { class: 'card ptask' }, h('h1', {}, data.task.title), rich(data.task.body),
            data.task.image ? h('img', { class: 'task-image', src: fileUrl(data.task.image), style: { maxHeight: '35vh' } }) : null,
            data.task.hint ? h('div', { class: 'hint' }, h('strong', {}, 'ヒント'), rich(data.task.hint)) : null)
          : (join ? null : h('div', { class: 'card muted' }, '先生の画面の「回答」タブで「提示に選ぶ」を押すと、ここに表示されます。')),
        subs.length ? h('div', { class: 'pgrid' }, subs.map((s) => h('div', { class: 'panswer', onclick: () => zoom(s) },
          h('div', { class: 'label' }, s.label), ...answerBody(s)))) : null);
    }

    const load = debounce(async () => {
      try {
        data = await api('GET', '/api/teacher/present/view');
      } catch (e) {
        if (e.status === 401 || e.status === 403) location.href = '/';
        return;
      }
      if ((showQr || data.showQr) && !qrSvg) qrSvg = await fetch('/api/teacher/join-qr.svg').then((r) => r.text());
      render();
    }, 200);

    $('#smaller').onclick = () => { prefs.size = Math.max(14, prefs.size - 2); applyPrefs(); };
    $('#bigger').onclick = () => { prefs.size = Math.min(48, prefs.size + 2); applyPrefs(); };
    $('#cols').onclick = () => { prefs.cols = (prefs.cols + 1) % 5; applyPrefs(); render(); };
    $('#qr').onclick = () => { showQr = !showQr; load(); };
    $('#full').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());

    applyPrefs();
    load();
    listen((e) => {
      if (['present', 'submission', 'tasks', 'resume', 'settings'].includes(e.type)) load();
    });
  </script>
</body>
</html>
