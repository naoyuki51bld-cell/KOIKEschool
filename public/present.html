<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示画面 - 数学ボード</title>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2463eb">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="数学ボード">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="present" id="view"></main>
  <div class="controls">
    <button class="small" id="smaller" title="文字を小さく">A−</button>
    <button class="small" id="bigger" title="文字を大きく">A＋</button>
    <button class="small" id="cols" title="列の数">列</button>
    <button class="small" id="qr" title="参加QRコード">QR</button>
    <button class="small" id="full" title="全画面">⛶</button>
  </div>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="/vendor/firebase.js"></script>
  <script src="/firebase-config.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const { h, fill, $, rich, img } = MB;
    const view = $('#view');
    const prefs = { size: 22, cols: 0 };
    try { Object.assign(prefs, JSON.parse(localStorage.getItem('mb-present') || '{}')); } catch { /* 無視 */ }
    let showQr = false;
    let store = null;

    function applyPrefs() {
      document.documentElement.style.setProperty('--present-size', `${prefs.size}px`);
      try { localStorage.setItem('mb-present', JSON.stringify(prefs)); } catch { /* 無視 */ }
    }

    function answerBody(s) {
      return [
        s.shortAnswer ? h('div', { style: { fontSize: '1.4em', fontWeight: 800 } }, s.shortAnswer) : null,
        s.text ? rich(s.text) : null,
        s.drawing ? img(s.drawing, { class: 'answer-image', alt: '手書き' }) : null,
        s.photo ? img(s.photo, { class: 'answer-image', alt: '写真' }) : null,
      ];
    }

    function zoom(label, s) {
      const el = h('div', { class: 'zoom', onclick: () => el.remove() },
        h('div', { style: { fontWeight: 800, color: 'var(--accent)', marginBottom: '12px' } }, label), ...answerBody(s));
      document.body.append(el);
    }

    function joinBox() {
      const code = store.state.settings.joinCode;
      const url = `${location.origin}/?join=${encodeURIComponent(code)}`;
      const qr = window.qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      const box = h('div', { class: 'qr', style: { width: '220px', height: '220px' } });
      box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      return h('div', { class: 'card join' }, box,
        h('div', {}, h('div', { class: 'muted' }, '参加コード'), h('div', { class: 'code-big', style: { fontSize: '3em' } }, code),
          h('div', { class: 'muted' }, location.origin)));
    }

    function render() {
      const p = store.state.present;
      const task = p.taskId ? store.state.tasks.get(p.taskId) : null;
      const subs = task ? store.submissionsOf(task.id) : [];
      const chosen = task ? (p.submissionKeys || []).map((k) => subs.find((s) => s.path === k)).filter(Boolean) : [];
      const cols = prefs.cols || (chosen.length <= 1 ? 1 : chosen.length <= 4 ? 2 : chosen.length <= 6 ? 3 : 4);
      view.style.setProperty('--cols', cols);
      const join = showQr || p.showQr ? joinBox() : null;
      fill(view,
        join,
        task
          ? h('div', { class: 'card ptask' }, h('h1', {}, task.title), rich(task.body),
            task.imageV ? img({ path: `tasks/${task.id}/files/image`, v: task.imageV }, { class: 'task-image', style: { maxHeight: '35vh' } }) : null,
            task.hint ? h('div', { class: 'hint' }, h('strong', {}, 'ヒント'), rich(task.hint)) : null)
          : (join ? null : h('div', { class: 'card muted' }, '先生の画面の「回答」タブで「提示に選ぶ」を押すと、ここに表示されます。')),
        chosen.length ? h('div', { class: 'pgrid' }, chosen.map((s, i) => {
          const label = p.showNames ? s.ownerName : `回答 ${String.fromCharCode(65 + i)}`;
          return h('div', { class: 'panswer', onclick: () => zoom(label, s) }, h('div', { class: 'label' }, label), ...answerBody(s));
        })) : null);
    }

    $('#smaller').onclick = () => { prefs.size = Math.max(14, prefs.size - 2); applyPrefs(); };
    $('#bigger').onclick = () => { prefs.size = Math.min(48, prefs.size + 2); applyPrefs(); };
    $('#cols').onclick = () => { prefs.cols = (prefs.cols + 1) % 5; applyPrefs(); render(); };
    $('#qr').onclick = () => { showQr = !showQr; render(); };
    $('#full').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());

    applyPrefs();
    (async () => {
      const who = await window.Store.whoami();
      if (who.role !== 'teacher') {
        location.href = '/';
        return;
      }
      store = window.Store.teacherStore(who);
      store.on(() => { if (store.state.ready) render(); });
    })();
  </script>
</body>
</html>
